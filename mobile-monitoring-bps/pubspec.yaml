name: mobile_monitoring_bps
description: "Aplikasi Mobile Monitoring BPS Kota Yogyakarta (PML & PPL) dengan Background Geolocation Tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  geolocator: ^10.1.0
  flutter_background_service: ^5.0.0
  permission_handler: ^11.0.0
  intl: ^0.18.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
